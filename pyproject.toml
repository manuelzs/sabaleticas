[project]
name = "sabaleticas"
version = "0.1.0"
description = "CLI and SQLite data layer for the Hacienda Sabaleticas cattle operation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # stdlib only; `prices fetch` also needs the `pdftotext` system binary (poppler)

[project.scripts]
sabaleticas = "sabaleticas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sabaleticas"]
