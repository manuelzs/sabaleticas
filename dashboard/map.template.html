<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Hacienda Sabaleticas — visor</title>
<style>
 :root{--bg:#12161a;--panel:#1b2128;--ink:#e6edf3;--muted:#8b98a5;--line:#2c343d}
 *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;
   background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 #wrap{position:fixed;inset:0}
 canvas{position:absolute;inset:0;cursor:crosshair;display:block}
 .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
   border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
 #side{top:12px;left:12px;width:232px;padding:12px 14px}
 #side h1{margin:0 0 2px;font-size:14px;letter-spacing:.2px}
 #side .sub{color:var(--muted);font-size:11px;margin-bottom:10px}
 label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
 label input{accent-color:#4fc3f7;margin:0}
 .sw{width:14px;height:4px;border-radius:2px;flex:none}
 #read{bottom:12px;left:12px;padding:9px 12px;font-variant-numeric:tabular-nums;min-width:232px}
 #read b{color:var(--muted);font-weight:500}
 #tools{top:12px;right:12px;padding:10px 12px;width:222px}
 button{background:#263039;color:var(--ink);border:1px solid var(--line);
   border-radius:7px;padding:5px 9px;font:inherit;cursor:pointer}
 button:hover{background:#2f3b46}
 button.on{background:#0b5c72;border-color:#0e7f9c}
 #mout{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}
 #mout .big{color:var(--ink);font-size:13px}
 .hint{color:var(--muted);font-size:11px;margin-top:6px}
 #scale{position:absolute;bottom:14px;right:14px;text-align:center;color:#fff;
   text-shadow:0 1px 3px #000;font-size:11px}
 #scale div{height:5px;border:2px solid #fff;border-top:none}
</style></head><body><div id="wrap">
<canvas id="cv"></canvas>
<canvas id="cv3" style="display:none"></canvas>

<div class="panel" id="side">
  <h1>Hacienda Sabaleticas</h1>
  <div class="sub">151.85 ha · La Pintada, Antioquia</div>
  <div id="layers"></div>
  <div class="hint">Arrastra para mover · rueda para zoom</div>
  <div class="hint">⚠ Las <b>cercas</b> del IGAC están incompletas: faltan muchas y varios
  potreros no cierran. Sirven de esqueleto, no son el mapa de potreros.</div>
</div>

<div class="panel" id="tools">
  <button id="btnMeasure">Medir</button>
  <button id="btnClear">Limpiar</button>
  <button id="btnReset">Vista inicial</button>
  <button id="btn3d" style="display:none">3D</button>
  <div id="ex3d" style="display:none;margin-top:8px">
    <label style="gap:6px"><span style="color:var(--muted);font-size:11px">exageración</span>
      <input id="exag" type="range" min="1" max="5" step="0.5" value="2" style="flex:1">
      <span id="exagv" style="color:var(--muted);font-size:11px">2×</span></label>
  </div>
  <div id="mout">Pulsa <b>Medir</b> y haz clic en dos o más puntos.</div>
  <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button id="btnDraw">Dibujar</button>
    <select id="dtype" style="background:#263039;color:var(--ink);border:1px solid var(--line);
      border-radius:7px;padding:5px;font:inherit;flex:1">
      <option value="tanque">Tanque</option>
      <option value="nacimiento">Nacimiento</option>
      <option value="bebedero">Bebedero</option>
      <option value="represa">Represa</option>
      <option value="tuberia">Tubería</option>
      <option value="potrero">Potrero</option>
      <option value="otro">Otro</option>
    </select>
  </div>
  <div id="dout" style="margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
    <button id="btnFinish" style="display:none">Terminar</button>
    <button id="btnUndo" style="display:none">Deshacer</button>
  </div>
  <div id="dlist" style="margin-top:8px;max-height:150px;overflow:auto;font-size:12px"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
    <button id="btnExport">Exportar GeoJSON</button>
  </div>
</div>

<div class="panel" id="read">
  <div><b>lat</b> <span id="rlat">—</span> &nbsp; <b>lon</b> <span id="rlon">—</span></div>
  <div><b>altura</b> <span id="rele">—</span></div>
</div>

<div id="scale"><div id="sbar" style="width:100px"></div><span id="slab">—</span></div>
</div>
<script>
const D = /*__DATA__*/;
const B = D.bounds, cv = document.getElementById('cv'), cx = cv.getContext('2d');
let W=0,H=0, view={x:0,y:0,s:1}, img=null, measuring=false, pts=[];

/* ---- projection: plate carrée, matching the orthophoto's world file ---- */
const LON2M = 111320*Math.cos((B.miny+B.maxy)/2*Math.PI/180), LAT2M = 110574;
function fx(lon){ return (lon-B.minx)/(B.maxx-B.minx); }
function fy(lat){ return 1-(lat-B.miny)/(B.maxy-B.miny); }
function toScreen(lon,lat){ return [fx(lon)*view.s+view.x, fy(lat)*view.s*aspect()+view.y]; }
function toGeo(px,py){
  return [B.minx+((px-view.x)/view.s)*(B.maxx-B.minx),
          B.miny+(1-(py-view.y)/(view.s*aspect()))*(B.maxy-B.miny)];
}
function aspect(){ return ((B.maxy-B.miny)*LAT2M)/((B.maxx-B.minx)*LON2M); }
function dist(a,b){
  const dx=(b[0]-a[0])*LON2M, dy=(b[1]-a[1])*LAT2M; return Math.hypot(dx,dy);
}

/* ---- terrain lookup ---- */
function elev(lon,lat){
  const d=D.dem; if(!d) return null;
  const i=Math.round((lon-d.minx)/d.dlon), j=Math.round((lat-d.miny)/d.dlat);
  if(i<0||j<0||j>=d.ny||i>=d.nx) return null;
  return d.grid[j][i];
}

/* ---- drawing ---- */
function ringPath(coords){
  cx.beginPath();
  for(let k=0;k<coords.length;k++){
    const p=toScreen(coords[k][0],coords[k][1]);
    k?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);
  }
}
function drawGeom(g,kind,fill){
  const t=g.t,c=g.c;
  const polys = t==='MultiPolygon'?c : t==='Polygon'?[c] : null;
  if(polys){
    for(const poly of polys){
      cx.beginPath();
      for(const ring of poly){
        for(let k=0;k<ring.length;k++){
          const p=toScreen(ring[k][0],ring[k][1]);
          k?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);
        }
        cx.closePath();
      }
      if(fill){cx.fillStyle=fill;cx.fill('evenodd');}
      cx.stroke();
    }
    return;
  }
  if(t==='Point'||t==='MultiPoint'){
    const ps = t==='Point'?[c]:c;
    for(const p of ps){ const s=toScreen(p[0],p[1]);
      cx.fillStyle=cx.strokeStyle; cx.beginPath(); cx.arc(s[0],s[1],5.5,0,7); cx.fill();
      cx.save(); cx.strokeStyle='#0b0e11'; cx.lineWidth=2; cx.stroke(); cx.restore(); }
    return;
  }
  const lines = t==='MultiLineString'?c : t==='LineString'?[c] : [];
  for(const line of lines){ ringPath(line); cx.stroke(); }
}
function draw(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,W,H);
  cx.fillStyle='#0d1114'; cx.fillRect(0,0,W,H);
  if(img){
    const a=toScreen(B.minx,B.maxy), b=toScreen(B.maxx,B.miny);
    cx.imageSmoothingQuality='high';
    cx.drawImage(img,a[0],a[1],b[0]-a[0],b[1]-a[1]);
  }
  for(const L of D.layers){
    if(!L.on) continue;
    cx.strokeStyle=L.colour; cx.lineWidth=L.width; cx.lineJoin='round';
    for(const f of L.features) drawGeom(f,L.kind,L.fill);
  }
  drawOverlay();
  if(pts.length){
    cx.strokeStyle='#fff'; cx.lineWidth=2; cx.setLineDash([6,5]);
    cx.beginPath();
    pts.forEach((p,k)=>{const s=toScreen(p[0],p[1]); k?cx.lineTo(s[0],s[1]):cx.moveTo(s[0],s[1]);});
    cx.stroke(); cx.setLineDash([]);
    pts.forEach(p=>{const s=toScreen(p[0],p[1]);
      cx.fillStyle='#ff1744';cx.strokeStyle='#fff';cx.lineWidth=2;
      cx.beginPath();cx.arc(s[0],s[1],5,0,7);cx.fill();cx.stroke();});
  }
  scaleBar();
}
function scaleBar(){
  const per = view.s/((B.maxx-B.minx)*LON2M);      // px per metre
  let m=1; const targets=[10,25,50,100,250,500,1000,2000];
  for(const t of targets){ if(t*per<=130) m=t; }
  document.getElementById('sbar').style.width=(m*per)+'px';
  document.getElementById('slab').textContent = m>=1000?(m/1000)+' km':m+' m';
}

/* ---- interaction ---- */
function resize(){
  W=innerWidth;H=innerHeight;
  cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
  cv.style.width=W+'px';cv.style.height=H+'px';draw();
}
function reset(){
  const s=Math.min(W/1, H/aspect())*0.92;
  view={s:s, x:(W-s)/2, y:(H-s*aspect())/2}; draw();
}
let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};});
addEventListener('mouseup',e=>{
  if(drag && !drag.moved && drawing){
    const g=toGeo(e.clientX,e.clientY);
    if(!draft) draft={tipo:document.getElementById('dtype').value,geom:[]};
    draft.geom.push(g);
    if(GEOM[draft.tipo]==='point') finishDraft(); else draw();
  } else if(drag && !drag.moved && measuring){
    pts.push(toGeo(e.clientX,e.clientY)); report(); draw();
  }
  drag=null;
});
addEventListener('mousemove',e=>{
  if(drag){
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3) drag.moved=true;
    view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); draw();
  }
  const g=toGeo(e.clientX,e.clientY), z=elev(g[0],g[1]);
  document.getElementById('rlat').textContent=g[1].toFixed(6);
  document.getElementById('rlon').textContent=g[0].toFixed(6);
  document.getElementById('rele').textContent = z?z.toFixed(0)+' m':'sin dato';
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const k=Math.exp(-e.deltaY*0.0016), old=view.s;
  view.s=Math.max(200,Math.min(400000,view.s*k));
  const r=view.s/old;
  view.x=e.clientX-(e.clientX-view.x)*r;
  view.y=e.clientY-(e.clientY-view.y)*r;
  draw();
},{passive:false});

function report(){
  const o=document.getElementById('mout');
  if(pts.length<2){o.innerHTML='Punto 1 marcado. Haz clic en el siguiente.';return;}
  let tot=0; for(let i=1;i<pts.length;i++) tot+=dist(pts[i-1],pts[i]);
  const a=elev(pts[0][0],pts[0][1]), b=elev(pts[pts.length-1][0],pts[pts.length-1][1]);
  let h='<div class="big"><b>distancia</b> '+(tot>=1000?(tot/1000).toFixed(2)+' km':tot.toFixed(0)+' m')+'</div>';
  if(a!=null&&b!=null){
    const d=b-a;
    h+='<div class="big"><b>desnivel</b> '+(d>0?'+':'')+d.toFixed(0)+' m</div>';
    h+='<div>'+(d<-2
      ? '↓ baja '+Math.abs(d).toFixed(0)+' m — <b>fluye por gravedad</b>'
      : d>2 ? '↑ sube '+d.toFixed(0)+' m — <b>necesita bombeo</b>'
            : 'prácticamente al mismo nivel')+'</div>';
    if(tot>0&&Math.abs(d)>0) h+='<div><b>pendiente</b> '+(100*d/tot).toFixed(1)+'%</div>';
  }
  o.innerHTML=h;
}
document.getElementById('btnMeasure').onclick=e=>{
  measuring=!measuring; e.target.classList.toggle('on',measuring);
  document.getElementById('mout').innerHTML = measuring
    ? 'Haz clic en dos o más puntos.' : 'Pulsa <b>Medir</b> y haz clic en dos o más puntos.';
};
document.getElementById('btnClear').onclick=()=>{pts=[];report();draw();
  document.getElementById('mout').innerHTML='Pulsa <b>Medir</b> y haz clic en dos o más puntos.';};
document.getElementById('btnReset').onclick=reset;

const box=document.getElementById('layers');
D.layers.forEach((L,i)=>{
  const id='L'+i;
  box.insertAdjacentHTML('beforeend',
    `<label><input type="checkbox" id="${id}" ${L.on?'checked':''}>
     <span class="sw" style="background:${L.colour}"></span>${L.name}</label>`);
  setTimeout(()=>document.getElementById(id).onchange=e=>{L.on=e.target.checked;draw();});
});

addEventListener('resize',resize);
if(D.ortho){
  img=new Image();
  img.onload=()=>{resize();reset();};
  img.onerror=()=>{img=null;resize();reset();};
  img.src=D.ortho;
} else { resize(); reset(); }
/* ================= drawing / digitising ================= */
const GEOM={tanque:'point',nacimiento:'point',bebedero:'point',
            represa:'polygon',tuberia:'line',potrero:'polygon',otro:'line'};
const DCOL={tanque:'#00e5ff',nacimiento:'#7cffcb',bebedero:'#4dd0e1',represa:'#0091ea',
            tuberia:'#b388ff',potrero:'#ffee58',otro:'#b39ddb'};
let drawn=[], draft=null, drawing=false;
try{ drawn=JSON.parse(localStorage.getItem('sab_drawn')||'[]'); }catch(e){ drawn=[]; }
const save=()=>{ try{localStorage.setItem('sab_drawn',JSON.stringify(drawn));}catch(e){} };

function ringArea(r){           // geodesic, m^2
  const R=6378137, n=r.length; let t=0;
  for(let i=0;i<n;i++){
    const a=r[i], b=r[(i+1)%n];
    t+=(b[0]-a[0])*Math.PI/180*(2+Math.sin(a[1]*Math.PI/180)+Math.sin(b[1]*Math.PI/180));
  }
  return Math.abs(t*R*R/2);
}
function lineLen(l){ let t=0; for(let i=1;i<l.length;i++) t+=dist(l[i-1],l[i]); return t; }
function metric(f){
  const g=GEOM[f.tipo];
  if(g==='polygon'&&f.geom.length>2) return (ringArea(f.geom)/10000).toFixed(2)+' ha';
  if(g==='line'&&f.geom.length>1){ const m=lineLen(f.geom);
    return m>=1000?(m/1000).toFixed(2)+' km':m.toFixed(0)+' m'; }
  if(g==='point'){ const z=elev(f.geom[0][0],f.geom[0][1]); return z?z.toFixed(0)+' m s.n.m.':''; }
  return '';
}
function drawOverlay(){
  for(const f of drawn.concat(draft?[draft]:[])){
    const g=GEOM[f.tipo], col=DCOL[f.tipo]||'#fff';
    cx.strokeStyle=col; cx.lineWidth=f===draft?2.5:2.2; cx.setLineDash(f===draft?[7,5]:[]);
    if(g==='point'){
      for(const p of f.geom){ const s=toScreen(p[0],p[1]);
        cx.fillStyle=col; cx.beginPath(); cx.arc(s[0],s[1],6,0,7); cx.fill();
        cx.strokeStyle='#0b0e11'; cx.lineWidth=2; cx.stroke(); }
    } else if(f.geom.length>1){
      cx.beginPath();
      f.geom.forEach((p,k)=>{const s=toScreen(p[0],p[1]); k?cx.lineTo(s[0],s[1]):cx.moveTo(s[0],s[1]);});
      if(g==='polygon'){ cx.closePath(); cx.fillStyle=col.replace(')',',.18)').replace('#','rgba(');
        cx.fillStyle='rgba(255,255,255,.10)'; cx.fill(); }
      cx.stroke();
    }
    if(f===draft) for(const p of f.geom){ const s=toScreen(p[0],p[1]);
      cx.fillStyle='#fff'; cx.beginPath(); cx.arc(s[0],s[1],3.5,0,7); cx.fill(); }
    cx.setLineDash([]);
    if(f!==draft&&f.nombre&&f.geom.length){
      const c=f.geom[0], s=toScreen(c[0],c[1]);
      cx.fillStyle='#fff'; cx.font='12px system-ui'; cx.strokeStyle='rgba(0,0,0,.75)';
      cx.lineWidth=3; cx.strokeText(f.nombre,s[0]+9,s[1]-8); cx.fillText(f.nombre,s[0]+9,s[1]-8);
    }
  }
}
function renderList(){
  const el=document.getElementById('dlist');
  el.innerHTML = drawn.length? drawn.map((f,i)=>
    `<div style="display:flex;gap:6px;align-items:center;padding:2px 0">
       <span class="sw" style="background:${DCOL[f.tipo]||'#fff'}"></span>
       <span style="flex:1">${f.nombre||f.tipo} <span style="color:var(--muted)">${metric(f)}</span></span>
       <a href="#" data-i="${i}" class="del" style="color:#ef5350;text-decoration:none">✕</a>
     </div>`).join('') : '<span style="color:var(--muted)">Nada dibujado aún.</span>';
  el.querySelectorAll('.del').forEach(a=>a.onclick=e=>{
    e.preventDefault(); drawn.splice(+a.dataset.i,1); save(); renderList(); draw();});
}
function finishDraft(){
  if(!draft) return;
  const g=GEOM[draft.tipo];
  const need = g==='point'?1 : g==='line'?2 : 3;
  if(draft.geom.length<need){ draft=null; draw(); return; }
  const nm=prompt(`Nombre para este ${draft.tipo}:`, draft.tipo);
  if(nm===null){ draft=null; draw(); return; }
  draft.nombre=nm.trim()||draft.tipo;
  drawn.push(draft); draft=null; save(); renderList(); draw();
  document.getElementById('dout').innerHTML='Guardado. Sigue dibujando o pulsa <b>Dibujar</b> para salir.';
}
function setDraw(on){
  drawing=on;
  document.getElementById('btnDraw').classList.toggle('on',on);
  document.getElementById('btnFinish').style.display=on?'inline-block':'none';
  document.getElementById('btnUndo').style.display=on?'inline-block':'none';
  if(on&&measuring){ measuring=false; document.getElementById('btnMeasure').classList.remove('on'); }
  document.getElementById('dout').innerHTML = on
    ? 'Haz clic para poner puntos. <b>Terminar</b> o doble clic para cerrar.'
    : '';
  if(!on){ draft=null; }
  draw();
}
document.getElementById('btnDraw').onclick=()=>setDraw(!drawing);
document.getElementById('btnFinish').onclick=finishDraft;
document.getElementById('btnUndo').onclick=()=>{ if(draft&&draft.geom.length){draft.geom.pop();draw();} };
cv.addEventListener('dblclick',e=>{ if(drawing){ e.preventDefault(); finishDraft(); } });
document.getElementById('btnExport').onclick=()=>{
  const fc={type:'FeatureCollection',features:drawn.map(f=>{
    const g=GEOM[f.tipo];
    const geom = g==='point'? {type:'Point',coordinates:f.geom[0]}
      : g==='line'? {type:'LineString',coordinates:f.geom}
      : {type:'Polygon',coordinates:[f.geom.concat([f.geom[0]])]};
    const pr={tipo:f.tipo,nombre:f.nombre,fuente:'trazado sobre la ortofoto IGAC 0.5 m'};
    if(g==='polygon'&&f.geom.length>2) pr.area_ha=+(ringArea(f.geom)/10000).toFixed(3);
    if(g==='line'&&f.geom.length>1) pr.largo_m=+lineLen(f.geom).toFixed(1);
    if(g==='point'){ const z=elev(f.geom[0][0],f.geom[0][1]); if(z) pr.altura_m=+z.toFixed(1); }
    return {type:'Feature',properties:pr,geometry:geom};
  })};
  const txt=JSON.stringify(fc,null,1);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/geo+json'}));
  a.download='trazado.geojson'; a.click();
  document.getElementById('dout').innerHTML=
    `Exportadas <b>${drawn.length}</b> geometrías a <b>trazado.geojson</b>.`;
};
renderList();

/* ================= 3D terrain (optional overlay) ================= */
let g3=null, is3d=false, cam={az:-0.6,el:0.62,d:2.3}, exag=2;
const c3=document.getElementById('cv3');

function mul(a,b){const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;
    for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k]; o[i*4+j]=s;} return o;}
function persp(f,ar,n,fa){const t=1/Math.tan(f/2);return new Float32Array(
  [t/ar,0,0,0, 0,t,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0]);}
function look(e,c,u){
  const z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z);z.forEach((v,i)=>z[i]=v/l);
  const x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];
  l=Math.hypot(...x)||1;x.forEach((v,i)=>x[i]=v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),
    -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1]);}

function init3d(){
  const gl=c3.getContext('webgl',{antialias:true}); if(!gl) return null;
  const M=D.mesh, nx=M.nx, ny=M.ny, G=M.grid;
  let lo=1e9,hi=-1e9;
  for(const r of G) for(const v of r) if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; }
  const AR=((B.maxy-B.miny)*LAT2M)/((B.maxx-B.minx)*LON2M);
  const VS=(hi-lo)/((B.maxx-B.minx)*LON2M);   // vertical unit relative to width
  const pos=[],uv=[],idx=[];
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const v=G[j][i];
    pos.push(i/(nx-1)-0.5, v==null?0:((v-lo)/(hi-lo))*VS, (0.5-j/(ny-1))*AR);
    uv.push(i/(nx-1), 1-j/(ny-1));
  }
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    if(G[j][i]==null||G[j][i+1]==null||G[j+1][i]==null||G[j+1][i+1]==null) continue;
    const a=j*nx+i,b=a+1,c=a+nx,d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const vs=`attribute vec3 p;attribute vec2 t;uniform mat4 mvp;uniform float ex;
    varying vec2 vt;varying float vh;
    void main(){vec3 q=vec3(p.x,p.y*ex,p.z);vh=p.y;vt=t;gl_Position=mvp*vec4(q,1.0);}`;
  const fs=`precision mediump float;uniform sampler2D s;varying vec2 vt;varying float vh;
    void main(){vec4 c=texture2D(s,vt);gl_FragColor=vec4(c.rgb,1.0);}`;
  function sh(t,src){const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  function buf(data,loc,n){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
    const a=gl.getAttribLocation(pr,loc);gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a,n,gl.FLOAT,false,0,0);}
  buf(pos,'p',3); buf(uv,'t',2);
  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(idx),gl.STATIC_DRAW);
  const ext=gl.getExtension('OES_element_index_uint');
  const tex=gl.createTexture();
  const im=new Image();
  im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    render3d();};
  im.src=D.tex;
  gl.enable(gl.DEPTH_TEST); gl.clearColor(0.05,0.07,0.08,1);
  return {gl,pr,n:idx.length,ext,lo,hi,VS,AR};
}
function render3d(){
  if(!g3) return;
  const {gl,pr,n}=g3;
  c3.width=W*devicePixelRatio; c3.height=H*devicePixelRatio;
  c3.style.width=W+'px'; c3.style.height=H+'px';
  gl.viewport(0,0,c3.width,c3.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const e=[Math.cos(cam.el)*Math.sin(cam.az)*cam.d, Math.sin(cam.el)*cam.d,
           Math.cos(cam.el)*Math.cos(cam.az)*cam.d];
  const mvp=mul(persp(0.9,W/H,0.01,20), look(e,[0,0.03,0],[0,1,0]));
  gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mvp'),false,mvp);
  gl.uniform1f(gl.getUniformLocation(pr,'ex'),exag);
  gl.drawElements(gl.TRIANGLES,n,gl.UNSIGNED_INT,0);
}
function set3d(on){
  is3d=on;
  document.getElementById('cv').style.display=on?'none':'block';
  c3.style.display=on?'block':'none';
  document.getElementById('ex3d').style.display=on?'block':'none';
  document.getElementById('btn3d').classList.toggle('on',on);
  document.getElementById('read').style.opacity=on?0.35:1;
  if(on){ if(!g3) g3=init3d(); render3d(); } else draw();
}
if(D.tex && D.mesh){
  const b=document.getElementById('btn3d'); b.style.display='inline-block';
  b.onclick=()=>set3d(!is3d);
  document.getElementById('exag').oninput=e=>{
    exag=parseFloat(e.target.value);
    document.getElementById('exagv').textContent=exag+'×'; render3d();};
  let d3=null;
  c3.addEventListener('mousedown',e=>{d3={x:e.clientX,y:e.clientY,az:cam.az,el:cam.el};});
  addEventListener('mouseup',()=>{d3=null;});
  addEventListener('mousemove',e=>{ if(!d3)return;
    cam.az=d3.az-(e.clientX-d3.x)*0.005;
    cam.el=Math.max(0.05,Math.min(1.45,d3.el+(e.clientY-d3.y)*0.005));
    render3d();});
  c3.addEventListener('wheel',e=>{e.preventDefault();
    cam.d=Math.max(0.6,Math.min(6,cam.d*Math.exp(e.deltaY*0.0012))); render3d();},{passive:false});
  addEventListener('resize',()=>{ if(is3d) render3d(); });
}

</script></body></html>
