<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Hacienda Sabaleticas — visor</title>
<style>
 :root{--bg:#12161a;--panel:#1b2128;--ink:#e6edf3;--muted:#8b98a5;--line:#2c343d}
 *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;
   background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 #wrap{position:fixed;inset:0}
 canvas{position:absolute;inset:0;cursor:crosshair;display:block}
 .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
   border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
 #side{top:12px;left:12px;width:238px;padding:13px 15px}
 #side h1{margin:0 0 2px;font-size:14px;letter-spacing:.2px}
 #side .sub{color:var(--muted);font-size:11px;margin-bottom:10px}
 label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
 label input{accent-color:#4fc3f7;margin:0}
 .sw{width:14px;height:4px;border-radius:2px;flex:none}
 #read{bottom:12px;left:12px;padding:9px 12px;font-variant-numeric:tabular-nums;min-width:232px}
 #read b{color:var(--muted);font-weight:500}
 #tools{top:12px;right:12px;padding:12px 14px;width:238px}
 button{background:#263039;color:var(--ink);border:1px solid var(--line);
   border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer;
   line-height:1.15;white-space:nowrap}
 button:hover{background:#2f3b46}
 button:active{transform:translateY(1px)}
 .btnrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
 .btnrow button{flex:0 0 auto}
 button.on{background:#0b5c72;border-color:#0e7f9c}
 #mout{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.55}
 #mout .big{color:var(--ink);font-size:13px}
 .hint{color:var(--muted);font-size:11px;margin-top:6px}
 #scale{position:absolute;bottom:14px;right:14px;text-align:center;color:#fff;
   text-shadow:0 1px 3px #000;font-size:11px}
 #scale div{height:5px;border:2px solid #fff;border-top:none}
 /* navigation: subsystem tabs, then the views that subsystem offers */
 #nav{position:absolute;top:12px;left:50%;transform:translateX(-50%);
   display:flex;flex-direction:column;align-items:center;gap:7px;z-index:5}
 #tabs,#views{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);
   border-radius:10px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
 #tabs button{padding:6px 15px;border-color:transparent;background:transparent;color:var(--muted)}
 #tabs button:hover{background:#263039;color:var(--ink)}
 #tabs button.on{background:#0b5c72;border-color:#0e7f9c;color:#fff}
 #tabs button[disabled]{opacity:.38;cursor:not-allowed}
 #tabs button[disabled]:hover{background:transparent;color:var(--muted)}
 #tabs .sep{width:1px;background:var(--line);margin:2px 5px;align-self:stretch}
 #views{padding:4px}
 #views button{padding:4px 12px;font-size:12px;border-color:transparent;background:transparent;
   color:var(--muted)}
 #views button:hover{background:#263039;color:var(--ink)}
 #views button.on{background:#263039;color:var(--ink);border-color:var(--line)}
 #views:empty{display:none}
 /* the nav supersedes the old inline toggles */
 #btn3d,#btnPid{display:none!important}
 .grp{margin:9px 0 2px;color:var(--muted);font-size:10px;letter-spacing:.09em;
   text-transform:uppercase}
 /* DOM views (lists, tables) render here, over the canvases */
 #page{position:absolute;inset:0;overflow:auto;background:var(--bg);display:none;
   padding:104px 26px 40px}
 #page .inner{max-width:1080px;margin:0 auto}
 #page h2{font-size:17px;margin:0 0 4px}
 #page .lead{color:var(--muted);font-size:12px;margin:0 0 18px;max-width:70ch;line-height:1.6}
 /* cards */
 .cards{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
   margin-bottom:30px}
 .card{position:relative;background:linear-gradient(160deg,#1b222a,#151b21);
   border:1px solid var(--line);border-radius:14px;padding:15px 16px 14px;overflow:hidden}
 .card::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--acc)}
 .card::after{content:'';position:absolute;top:-46px;right:-46px;width:112px;height:112px;
   border-radius:50%;background:var(--acc);opacity:.10;filter:blur(14px)}
 .card .top{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;
   margin-bottom:12px;position:relative;z-index:1}
 .card .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;
   box-shadow:0 0 8px var(--acc)}
 .card .big{font:600 33px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
   letter-spacing:-.02em;position:relative;z-index:1}
 .card .big small{font-size:15px;color:var(--muted);margin-left:3px;font-weight:400}
 .card .mag{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;
   margin-top:7px}
 .card .ent{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
   font-size:12.5px;font-weight:600}
 .card .meta{color:var(--muted);font-size:11px;margin-top:3px}
 .card.ghost{background:#151a1f;border-style:dashed}
 .card.ghost .big{color:#4b5761;font-size:24px}
 .card .why{color:var(--muted);font-size:11.5px;line-height:1.55;margin-top:10px}
 .tr{margin-top:10px;display:flex;align-items:center;gap:9px;font-size:11px;color:var(--acc)}
 .tr svg{width:64px;height:18px;flex:none}
 .tr svg path{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
 .tr i{color:var(--muted);font-style:normal}
 .tr.none{color:#4b5761;font-size:10.5px}
 .card .why ul{margin:5px 0 0 14px;padding:0}
 /* rows: same material as the cards, accent moved to the left margin */
 .rows{display:flex;flex-direction:column;gap:8px;margin-bottom:30px}
 .row{position:relative;display:flex;align-items:center;gap:20px;overflow:hidden;
   background:linear-gradient(100deg,#1b222a,#151b21);border:1px solid var(--line);
   border-radius:12px;padding:13px 17px 13px 20px}
 .row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
 .row::after{content:'';position:absolute;left:-40px;top:50%;width:120px;height:120px;
   transform:translateY(-50%);border-radius:50%;background:var(--acc);opacity:.09;filter:blur(16px)}
 .row .main{flex:1;min-width:0;position:relative;z-index:1}
 .row .nm{font-weight:600;font-size:13px}
 .row .side{display:flex;align-items:center;gap:14px;flex:none;position:relative;z-index:1}
 .row .col{width:118px;flex:none}
 .row .col.narrow{width:104px}
 .row .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
 .row .v{font-size:12.5px;margin-top:3px;line-height:1.35}
 /* sparkline — flat when nothing is arriving, drifting when it is */
 .spark{width:66px;height:22px;flex:none;overflow:hidden}
 .spark path{fill:none;stroke:var(--acc);stroke-width:1.7;stroke-linecap:round;opacity:.85}
 .spark.live path{animation:flow 2.6s linear infinite}
 @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-66px)}}
 /* horizontal bars for distributions */
 .bars{display:flex;flex-direction:column;gap:7px;margin-bottom:26px}
 .bar{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:13px}
 .bar .lbl{font-size:12px;color:var(--muted);text-align:right}
 .bar .track{height:24px;background:#151b21;border-radius:6px;overflow:hidden;display:flex}
 .bar .fill{height:100%;transition:width .5s ease}
 .bar .num{font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
   font-variant-numeric:tabular-nums}
 .warn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;
   background:#ff910014;border:1px solid #ff910033;color:#ffb459;font-size:12px;
   margin:0 0 20px;line-height:1.5;max-width:74ch}
 .legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin:-14px 0 22px}
 .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
 .mini{display:flex;align-items:flex-end;gap:3px;height:52px;margin-bottom:6px}
 .mini div{flex:1;background:#2f7f9c;border-radius:2px 2px 0 0;min-height:2px}
 .mini div.hi{background:#4fc3f7}
 /* findings drawer — insights live here, not on the instrument panel */
 #drawer{position:absolute;top:0;right:0;bottom:0;width:310px;background:#12171c;
   border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;
   z-index:20;overflow:auto;display:flex;flex-direction:column}
 #drawer.open{transform:none;box-shadow:-16px 0 40px rgba(0,0,0,.5)}
 .dhead{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;
   font-weight:600;font-size:13px;border-bottom:1px solid var(--line);position:sticky;top:0;
   background:#12171c}
 .dhead .n{color:var(--muted);font-weight:400;font-size:11px}
 .fnd{display:block;width:100%;text-align:left;background:transparent;border:none;
   border-bottom:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0;
   padding:12px 16px;cursor:pointer;color:var(--ink)}
 .fnd:hover{background:#171d23}
 .fnd .fv{font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc)}
 .fnd .ft{font-size:12.5px;margin-top:5px}
 .fnd .fd{color:var(--muted);font-size:11px;margin-top:2px}
 .badge{display:inline-block;min-width:17px;padding:1px 5px;border-radius:99px;
   background:#37424c;color:var(--ink);font-size:10px;text-align:center;margin-left:6px}
 .badge.alta{background:#ff5252;color:#fff}
 .badge.cero{opacity:.4}
 /* compact, generated context strip — replaces the hand-written warning blocks */
 .strip{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 20px;font-size:11.5px}
 .strip span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;
   background:#171d23;border:1px solid var(--line);color:var(--muted)}
 .strip b{color:var(--ink);font-weight:600}
 .sect{display:flex;align-items:baseline;gap:11px;margin:0 0 16px}
 .sect .n{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
 table{border-collapse:collapse;width:100%;font-size:12.5px}
 th{text-align:left;color:var(--muted);font-weight:500;font-size:10.5px;
   letter-spacing:.08em;text-transform:uppercase;padding:0 12px 7px 0;
   border-bottom:1px solid var(--line)}
 td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
 tr:hover td{background:#171d23}
 .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;
   white-space:nowrap}
 .val{font-variant-numeric:tabular-nums;font-size:15px}
 .sub2{color:var(--muted);font-size:11.5px;line-height:1.5;margin-top:3px}
 .todo{color:var(--muted);font-size:11.5px;margin:3px 0 0 15px;padding:0}
 .todo li{margin:1px 0}
</style></head><body><div id="wrap">
<canvas id="cv"></canvas>
<canvas id="cv3" style="display:none"></canvas>
<canvas id="cvp" style="display:none"></canvas>

<div id="nav"><div id="tabs"></div><div id="views"></div></div>
<div id="drawer"></div>
<div id="page"><div class="inner" id="pageInner"></div></div>

<div class="panel" id="side">
  <h1 id="fname">—</h1>
  <div class="sub" id="fsub">—</div>
  <div style="color:var(--muted);font-size:11px;margin:2px 0 3px;letter-spacing:.4px">FONDOS</div>
  <label style="gap:8px"><input type="checkbox" id="baseOn" checked>
    <span class="sw" style="background:#78909c"></span>Foto aérea</label>
  <input id="baseOp" type="range" min="10" max="100" value="100"
         style="width:calc(100% - 22px);margin:2px 0 6px 22px">
  <label style="gap:8px"><input type="checkbox" id="planoOn">
    <span class="sw" style="background:#e0c9a6"></span>Plano 2003 (calco)</label>
  <div id="planoBox" style="display:none;margin:2px 0 6px 22px">
    <label style="gap:6px"><span style="color:var(--muted);font-size:11px;width:52px">opacidad</span>
      <input id="planoOp" type="range" min="10" max="100" value="65" style="flex:1"></label>
    <div class="btnrow" style="margin-top:7px">
      <button id="planoAlign">Alinear</button>
      <button id="planoRotL">⟲</button>
      <button id="planoRotR">⟳</button>
      <button id="planoCal">Calibrar 2 pts</button>
      <button id="planoMulti">Puntos (N)</button>
      <button id="planoUndo">Deshacer par</button>
      <button id="planoReset">Reset</button>
    </div>
    <div class="hint" id="planoHint">Enciende <b>Alinear</b>: arrastra para mover, rueda para
    escalar, ⟲⟳ para girar. Se guarda solo.</div>
  </div>
  <div style="color:var(--muted);font-size:11px;margin:8px 0 3px;letter-spacing:.4px">CAPAS</div>
  <div id="layers"></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:9px 0">
  <div class="hint">Arrastra para mover · rueda para zoom</div>
</div>

<div class="panel" id="tools">
  <div class="btnrow">
    <button id="btnMeasure">Medir</button>
    <button id="btnClear">Limpiar</button>
    <button id="btnReset">Vista inicial</button>
    <button id="btn3d" style="display:none">3D</button>
    <button id="btnPid" style="display:none">Esquema</button>
  </div>
  <div id="ex3d" style="display:none;margin-top:8px">
    <label style="gap:6px"><span style="color:var(--muted);font-size:11px">exageración</span>
      <input id="exag" type="range" min="1" max="5" step="0.5" value="2" style="flex:1">
      <span id="exagv" style="color:var(--muted);font-size:11px">2×</span></label>
  </div>
  <div id="mout">Pulsa <b>Medir</b> y haz clic en dos o más puntos.</div>
  <!-- Drawing tools: intentionally hidden (Manuel, 2026-08-21). The code below is kept
       and fully functional; flip DRAW_UI to true to bring the controls back. -->
  <div id="drawUI" style="display:none">
  <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button id="btnDraw">Dibujar</button>
    <select id="dtype" style="background:#263039;color:var(--ink);border:1px solid var(--line);
      border-radius:7px;padding:5px;font:inherit;flex:1">
      <option value="tanque">Tanque</option>
      <option value="nacimiento">Nacimiento</option>
      <option value="bebedero">Bebedero</option>
      <option value="represa">Represa</option>
      <option value="tuberia">Tubería</option>
      <option value="potrero">Potrero</option>
      <option value="otro">Otro</option>
    </select>
  </div>
  <div id="dout" style="margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
    <button id="btnFinish" style="display:none">Terminar</button>
    <button id="btnUndo" style="display:none">Deshacer</button>
  </div>
  <div id="dlist" style="margin-top:8px;max-height:150px;overflow:auto;font-size:12px"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
    <button id="btnExport">Exportar GeoJSON</button>
  </div>
  </div><!-- /drawUI -->
</div>

<div class="panel" id="read">
  <div><b>lat</b> <span id="rlat">—</span> &nbsp; <b>lon</b> <span id="rlon">—</span></div>
  <div><b>altura</b> <span id="rele">—</span></div>
  <div id="rcurw" style="display:none"><b>curva</b> <span id="rcur">—</span></div>
  <div><b>pendiente</b> <span id="rslp">—</span></div>
  <div style="margin-top:5px;opacity:.75;font-size:11px">
    <b>C</b> captura el punto · <b><span id="rcapn">0</span></b> capturados · <b>X</b> borra</div>
</div>

<div id="scale"><div id="sbar" style="width:100px"></div><span id="slab">—</span></div>
</div>
<script>
/*__JS__*/</script></body></html>
